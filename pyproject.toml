[project]
name = "localrag"
version = "0.1.0"
description = "Kho tài liệu học thuật cục bộ (tìm kiếm lai DOCX/PDF/PPTX, OCR, offline)"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pywebview", "python-docx", "python-pptx", "pypdfium2", "Pillow",
  "onnxruntime", "tokenizers", "numpy", "huggingface_hub", "pyyaml", "httpx", "psutil", "pydantic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
